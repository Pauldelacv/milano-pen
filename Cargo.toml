[workspace]
resolver = "2"
members = ["crates/milano-core", "src-tauri"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/pauldelacv/milano-pen"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "fs"] }
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"

[profile.dev.package."*"]
# Image decoding is unbearably slow unoptimised; dependencies are built once.
opt-level = 2
