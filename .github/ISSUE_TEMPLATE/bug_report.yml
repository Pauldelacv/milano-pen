name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please don't include private board content or personal data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a note…
        2. Drag it…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Milano Pen version
      description: Milano Pen → About Milano Pen
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options: [Apple Silicon, Intel]
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Run the app from Terminal (`/Applications/Milano\ Pen.app/Contents/MacOS/milano-pen`) to see logs.
